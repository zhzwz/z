name: Publish @zhzwz/z

on:
  push:
    tags:
      - 'z@v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/z@v}"
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag z@v${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deps

      # 发布后 workspace:^ 会解析到 npm 上的 @zhzwz/eslint-config，其发布内容必须与这里构建测试的一致。
      - name: Verify @zhzwz/eslint-config matches the published version
        run: |
          VERSION=$(jq -r .version packages/eslint-config/package.json)
          if ! CHANGED=$(npm diff --diff-name-only --diff="@zhzwz/eslint-config@${VERSION}" --diff=./packages/eslint-config); then
            echo "::error::Cannot compare with @zhzwz/eslint-config@${VERSION} on npm. Is it published?"
            exit 1
          fi
          if [ -n "$CHANGED" ]; then
            echo "::error::@zhzwz/eslint-config differs from the published ${VERSION}. Bump and publish it first."
            echo "$CHANGED"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # npm publish 不会替换 workspace: 协议，必须用 pnpm 打包。
      - run: pnpm pack
      - run: npm publish ./zhzwz-z-*.tgz
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
