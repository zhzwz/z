name: Publish @zhzwz/eslint-config

on:
  push:
    tags:
      - 'eslint-config@v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/eslint-config@v}"
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag eslint-config@v${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

      - run: npm publish
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
